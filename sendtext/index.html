<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note chung</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#d8dce3; --accent:#2563eb; --ok:#15803d; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a9; --line:#2b303a; --accent:#5b8def; --ok:#4ade80; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; justify-content:center; padding:16px; }
  main { width:100%; max-width:820px; display:flex; flex-direction:column; gap:10px; }
  textarea { width:100%; min-height:60vh; resize:vertical; padding:14px; font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:12px; outline:none; }
  textarea:focus { border-color:var(--accent); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; padding:9px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; }
  #status { margin-left:auto; color:var(--muted); font-size:14px; }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
  .hint { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <textarea id="box" placeholder="Gõ hoặc dán text rồi bấm Gửi…" spellcheck="false" autofocus></textarea>
  <div class="row">
    <button class="primary" id="send">Gửi (Ctrl+Enter)</button>
    <button id="copy">Sao chép</button>
    <button id="reload">Tải lại</button>
    <span id="status"></span>
  </div>
  <div class="hint">Mở trang này trên máy nào cũng thấy note vừa gửi. Tối đa ~4000 byte, lưu khoảng 12 giờ.</div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const box = $('box'), st = $('status');
  const SERVER = 'https://ntfy.sh/';
  const MAX = 400000;

  // kênh lưu note tự lấy từ địa chỉ trang -> máy nào mở cùng trang là cùng note
  const topic = 'note-' + (location.hostname + location.pathname).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 55);

  let dirty = false, busy = false;
  const setStatus = (m, k = '') => { st.textContent = m; st.className = k; };

  async function load(force = false) {
    if (dirty && !force) return;
    setStatus('Đang tải…');
    try {
      const r = await fetch(SERVER + topic + '/json?poll=1&since=all', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const lines = (await r.text()).split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } });
      const msgs = lines.filter(m => m && m.event === 'message');
      const last = msgs[msgs.length - 1];
      box.value = last ? last.message : '';
      dirty = false;
      setStatus(last ? 'Đã tải ' + new Date().toLocaleTimeString() : 'Chưa có note nào', last ? 'ok' : '');
    } catch (e) { setStatus('Lỗi tải: ' + e.message, 'err'); }
  }

  async function send() {
    if (busy) return;
    const text = box.value;
    if (!text.trim()) { setStatus('Chưa có nội dung', 'err'); return; }
    if (new TextEncoder().encode(text).length > MAX) { setStatus('Quá dài (tối đa ~4000 byte)', 'err'); return; }
    busy = true; $('send').disabled = true; setStatus('Đang gửi…');
    try {
      const r = await fetch(SERVER + topic, { method: 'POST', body: text, headers: { 'Content-Type': 'text/plain; charset=utf-8' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      dirty = false;
      setStatus('Đã gửi ' + new Date().toLocaleTimeString(), 'ok');
    } catch (e) { setStatus('Lỗi gửi: ' + e.message, 'err'); }
    finally { busy = false; $('send').disabled = false; }
  }

  async function copyText(t, msg) {
    try { await navigator.clipboard.writeText(t); }
    catch { const x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); }
    setStatus(msg, 'ok');
  }

  box.addEventListener('input', () => { dirty = true; setStatus('Chưa gửi'); });
  box.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); send(); } });
  $('send').onclick = send;
  $('copy').onclick = () => copyText(box.value, 'Đã sao chép');
  $('reload').onclick = () => load(true);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(() => { if (!document.hidden) load(); }, 20000);

  load(true);
})();
</script>
</body>
</html>
