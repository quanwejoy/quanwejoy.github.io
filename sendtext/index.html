<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipboard chung</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#d8dce3; --accent:#2563eb; --ok:#15803d; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a9; --line:#2b303a; --accent:#5b8def; --ok:#4ade80; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 10px; }
  textarea { flex: 1; min-height: 55vh; width: 100%; resize: vertical; padding: 14px; font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 12px; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { color: var(--muted); font-size: 14px; margin-left: auto; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
  summary { cursor: pointer; color: var(--muted); }
  details label { display: block; margin-top: 10px; color: var(--muted); }
  details input { width: 100%; padding: 8px 10px; margin-top: 4px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <textarea id="box" placeholder="Dán hoặc gõ văn bản ở đây rồi bấm Gửi…" spellcheck="false"></textarea>

  <div class="row">
    <button class="primary" id="send">Gửi (Ctrl+Enter)</button>
    <button id="copy">Sao chép</button>
    <button id="reload">Tải lại</button>
    <span id="status"></span>
  </div>

  <details id="settings">
    <summary>Cài đặt (chỉ cần trên máy muốn GỬI)</summary>
    <label>GitHub token (fine-grained, quyền Contents: Read and write cho repo này)
      <input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
    </label>
    <label>Chủ repo (để trống = tự nhận từ địa chỉ trang)
      <input id="owner" placeholder="username">
    </label>
    <label>Tên repo (để trống = tự nhận)
      <input id="repo" placeholder="ten-repo">
    </label>
    <label>File lưu nội dung
      <input id="path" placeholder="message.txt">
    </label>
    <div class="row" style="margin-top:12px">
      <button id="saveCfg">Lưu cài đặt</button>
      <button id="clearCfg">Xoá token khỏi máy này</button>
    </div>
    <div class="hint">Token chỉ lưu trong trình duyệt của máy này. Máy chỉ muốn đọc/sao chép thì không cần nhập gì.</div>
  </details>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const box = $('box'), statusEl = $('status');
  const LS = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
  const LSset = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };

  let dirty = false;      // người dùng đã sửa mà chưa gửi
  let busy = false;

  function cfg() {
    const host = location.hostname;
    const guessOwner = host.endsWith('.github.io') ? host.split('.')[0] : '';
    const seg = location.pathname.split('/').filter(Boolean)[0];
    const guessRepo = host.endsWith('.github.io') ? (seg && !seg.includes('.') ? seg : host) : '';
    return {
      owner: LS('cb_owner') || guessOwner,
      repo:  LS('cb_repo')  || guessRepo,
      path:  LS('cb_path')  || 'message.txt',
      token: LS('cb_token')
    };
  }

  function setStatus(msg, kind = '') { statusEl.textContent = msg; statusEl.className = kind; }

  function url(c) {
    return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`;
  }
  function headers(c, accept) {
    const h = { Accept: accept };
    if (c.token) h.Authorization = 'Bearer ' + c.token;
    return h;
  }

  const toB64 = s => {
    const bytes = new TextEncoder().encode(s);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };

  async function load(force = false) {
    const c = cfg();
    if (!c.owner || !c.repo) { setStatus('Chưa xác định repo — mở Cài đặt', 'err'); return; }
    if (dirty && !force) return;
    setStatus('Đang tải…');
    try {
      const res = await fetch(url(c) + '?t=' + Date.now(), { headers: headers(c, 'application/vnd.github.raw+json'), cache: 'no-store' });
      if (res.status === 404) { box.value = ''; dirty = false; setStatus('Chưa có nội dung'); return; }
      if (res.status === 403 || res.status === 429) { setStatus('Quá giới hạn truy cập GitHub, thử lại sau', 'err'); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      box.value = await res.text();
      dirty = false;
      setStatus('Đã tải ' + new Date().toLocaleTimeString(), 'ok');
    } catch (e) { setStatus('Lỗi tải: ' + e.message, 'err'); }
  }

  async function send(retry = true) {
    const c = cfg();
    if (!c.token) { $('settings').open = true; $('token').focus(); setStatus('Cần nhập token để gửi', 'err'); return; }
    if (busy) return;
    busy = true; $('send').disabled = true; setStatus('Đang gửi…');
    try {
      // lấy sha hiện tại (nếu file đã tồn tại)
      let sha;
      const g = await fetch(url(c) + '?t=' + Date.now(), { headers: headers(c, 'application/vnd.github+json'), cache: 'no-store' });
      if (g.ok) sha = (await g.json()).sha;
      else if (g.status !== 404) throw new Error('HTTP ' + g.status + (g.status === 401 ? ' (token sai/hết hạn)' : ''));

      const body = { message: 'update ' + new Date().toISOString(), content: toB64(box.value) };
      if (sha) body.sha = sha;
      const p = await fetch(url(c), { method: 'PUT', headers: { ...headers(c, 'application/vnd.github+json'), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (p.status === 409 && retry) { busy = false; return send(false); }
      if (!p.ok) {
        const j = await p.json().catch(() => ({}));
        throw new Error('HTTP ' + p.status + (j.message ? ' – ' + j.message : ''));
      }
      dirty = false;
      setStatus('Đã gửi ' + new Date().toLocaleTimeString(), 'ok');
    } catch (e) { setStatus('Lỗi gửi: ' + e.message, 'err'); }
    finally { busy = false; $('send').disabled = false; }
  }

  async function copy() {
    try { await navigator.clipboard.writeText(box.value); }
    catch { box.select(); document.execCommand('copy'); }
    setStatus('Đã sao chép', 'ok');
  }

  box.addEventListener('input', () => { dirty = true; setStatus('Chưa gửi'); });
  box.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); send(); } });
  $('send').onclick = () => send();
  $('copy').onclick = copy;
  $('reload').onclick = () => load(true);

  // cài đặt
  const c0 = cfg();
  $('token').value = c0.token; $('owner').value = LS('cb_owner'); $('repo').value = LS('cb_repo'); $('path').value = LS('cb_path');
  $('saveCfg').onclick = () => {
    LSset('cb_token', $('token').value.trim()); LSset('cb_owner', $('owner').value.trim());
    LSset('cb_repo', $('repo').value.trim()); LSset('cb_path', $('path').value.trim());
    setStatus('Đã lưu cài đặt', 'ok'); load(true);
  };
  $('clearCfg').onclick = () => { LSset('cb_token', ''); $('token').value = ''; setStatus('Đã xoá token', 'ok'); };

  // tự làm mới khi quay lại tab; có token thì thêm poll 30s (giới hạn API cao hơn)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(() => { if (!document.hidden && cfg().token) load(); }, 30000);

  load(true);
})();
</script>
</body>
</html>
